[project]
name = "llms-101"
version = "0.1.0"
description = "LLM 101: A collection of examples of using LLMs in a workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "black>=25.1.0",
    "pydantic>=2.11.4",
    "python-dotenv>=1.1.0",
    "termcolor>=3.1.0",
    "langchain>=0.3.25",
    "langchain-ibm>=0.3.10",
    "langchain-ollama>=0.3.2",
    "langchain-community>=0.3.23",
    "langchain-chroma>=0.2.3",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.6",
]
